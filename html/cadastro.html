<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

<div class="caixa">

    <h2 class="title">Cadastro</h2>

    <form id="formCadastro">

        <div class="grupo-input">
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >
        </div>

        <div class="grupo-input">
            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >
        </div>

        <div class="grupo-input">
            <label>Repita a senha</label>

            <input
                type="password"
                id="senha-rep"
                placeholder="Repita sua senha"
                required
            >
        </div>

        <button
            type="submit"
            class="botaoprimario"
        >
            Cadastrar
        </button>

        <div class="bntvoltar">
            <a href="home.html">
                ← Voltar
            </a>
        </div>

    </form>

</div>
<script src="../scriptsJS/cadastrausuario.js"></script>
</body>
</html>
